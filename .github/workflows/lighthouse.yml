name: Lighthouse Audit

on:
  schedule:
    # Run on the 1st of each month at 9am UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit (defaults to production site)'
        required: false
        default: 'https://aoneill.co.uk'

permissions:
  contents: read
  issues: write

env:
  SITE_URL: ${{ github.event.inputs.url || 'https://aoneill.co.uk' }}

jobs:
  lighthouse:
    name: Run Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse
        run: npm install -g lighthouse chrome-launcher

      - name: Create results directory
        run: mkdir -p lighthouse-results

      - name: Run Lighthouse Audits
        run: |
          # Function to run lighthouse and extract scores
          run_audit() {
            local url=$1
            local name=$2
            local preset=$3

            echo "Running audit for $name ($preset)..."

            if [ "$preset" = "desktop" ]; then
              lighthouse "$url" \
                --output=json \
                --output-path="./lighthouse-results/${name}.json" \
                --chrome-flags="--headless --no-sandbox --disable-gpu" \
                --preset=desktop \
                --only-categories=performance,accessibility,best-practices,seo \
                --quiet || true
            else
              lighthouse "$url" \
                --output=json \
                --output-path="./lighthouse-results/${name}.json" \
                --chrome-flags="--headless --no-sandbox --disable-gpu" \
                --only-categories=performance,accessibility,best-practices,seo \
                --quiet || true
            fi
          }

          # Run audits for each page
          run_audit "${{ env.SITE_URL }}/" "home-mobile" "mobile"
          run_audit "${{ env.SITE_URL }}/" "home-desktop" "desktop"
          run_audit "${{ env.SITE_URL }}/projects" "projects" "mobile"
          run_audit "${{ env.SITE_URL }}/lab" "lab" "mobile"
          run_audit "${{ env.SITE_URL }}/contact" "contact" "mobile"

      - name: Parse Results and Create Summary
        run: |
          echo "## 🔦 Lighthouse Audit Results" > lighthouse-summary.md
          echo "" >> lighthouse-summary.md
          echo "**Audit Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> lighthouse-summary.md
          echo "**Site:** ${{ env.SITE_URL }}" >> lighthouse-summary.md
          echo "" >> lighthouse-summary.md
          echo "---" >> lighthouse-summary.md
          echo "" >> lighthouse-summary.md

          # Process each result file
          for file in ./lighthouse-results/*.json; do
            if [ -f "$file" ]; then
              name=$(basename "$file" .json)
              echo "### 📄 ${name}" >> lighthouse-summary.md
              echo "" >> lighthouse-summary.md

              # Extract scores using jq
              perf=$(jq -r '(.categories.performance.score // 0) * 100 | floor' "$file" 2>/dev/null || echo "N/A")
              a11y=$(jq -r '(.categories.accessibility.score // 0) * 100 | floor' "$file" 2>/dev/null || echo "N/A")
              bp=$(jq -r '(.categories["best-practices"].score // 0) * 100 | floor' "$file" 2>/dev/null || echo "N/A")
              seo=$(jq -r '(.categories.seo.score // 0) * 100 | floor' "$file" 2>/dev/null || echo "N/A")

              # Add score emojis
              get_emoji() {
                local score=$1
                if [ "$score" = "N/A" ]; then echo "❓"
                elif [ "$score" -ge 90 ]; then echo "🟢"
                elif [ "$score" -ge 50 ]; then echo "🟠"
                else echo "🔴"
                fi
              }

              echo "| Metric | Score |" >> lighthouse-summary.md
              echo "|--------|-------|" >> lighthouse-summary.md
              echo "| $(get_emoji $perf) Performance | **${perf}** |" >> lighthouse-summary.md
              echo "| $(get_emoji $a11y) Accessibility | **${a11y}** |" >> lighthouse-summary.md
              echo "| $(get_emoji $bp) Best Practices | **${bp}** |" >> lighthouse-summary.md
              echo "| $(get_emoji $seo) SEO | **${seo}** |" >> lighthouse-summary.md
              echo "" >> lighthouse-summary.md
            fi
          done

          echo "---" >> lighthouse-summary.md
          echo "" >> lighthouse-summary.md
          echo "_Generated by GitHub Actions workflow_" >> lighthouse-summary.md

          echo "=== Summary ==="
          cat lighthouse-summary.md

      - name: Upload Lighthouse Results
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-results
          path: |
            lighthouse-results/
            lighthouse-summary.md
          retention-days: 90

      - name: Create Issue with Results
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Monthly Lighthouse Audit - ${{ github.run_id }}"
          content-filepath: ./lighthouse-summary.md
          labels: |
            lighthouse
            automated
