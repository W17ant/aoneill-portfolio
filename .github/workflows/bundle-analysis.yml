name: Bundle Analysis

on:
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and analyze
        run: npm run build
        env:
          ANALYZE: true

      - name: Get bundle stats
        id: bundle-stats
        run: |
          # Extract bundle sizes from .next/build-manifest.json
          if [ -f ".next/build-manifest.json" ]; then
            echo "Build manifest found"
          fi

          # Get total size of .next/static
          STATIC_SIZE=$(du -sh .next/static 2>/dev/null | cut -f1 || echo "N/A")
          echo "static_size=$STATIC_SIZE" >> $GITHUB_OUTPUT

          # Get JS bundle sizes
          JS_SIZE=$(find .next -name "*.js" -type f -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1 || echo "N/A")
          echo "js_size=$JS_SIZE" >> $GITHUB_OUTPUT

          # Get total .next size
          TOTAL_SIZE=$(du -sh .next 2>/dev/null | cut -f1 || echo "N/A")
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            const staticSize = '${{ steps.bundle-stats.outputs.static_size }}';
            const jsSize = '${{ steps.bundle-stats.outputs.js_size }}';
            const totalSize = '${{ steps.bundle-stats.outputs.total_size }}';

            const body = `## Bundle Size Analysis

            | Metric | Size |
            |--------|------|
            | Static Assets | ${staticSize} |
            | JavaScript | ${jsSize} |
            | Total Build | ${totalSize} |

            > Sizes are approximate and may vary between builds.
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Bundle Size Analysis')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
